<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greyrock Motion | Launch films, 3D walkthroughs and ad films in Ujjain and Indore</title>
<meta name="description" content="Greyrock Motion is a film and visuals studio in Ujjain and Indore. Launch films, 3D walkthroughs and ad films for builders, hotels and brands.">
<meta name="theme-color" content="#121315">
<meta property="og:title" content="Greyrock Motion">
<meta property="og:description" content="Launch films, 3D walkthroughs and ad films for builders, hotels and brands in Ujjain and Indore.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://greyrockmotion.com/">
<meta property="og:image" content="https://greyrockmotion.com/assets/stills/home-01-exterior-front.jpg">
<meta property="og:image:width" content="1920">
<meta property="og:image:height" content="1080">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://greyrockmotion.com/">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<a class="skip" href="#work">Skip to the work</a>

<header class="top" id="top">
  <a class="lockup" href="#top">
    <img class="logo" src="assets/greyrock-logo.svg" alt="Greyrock Motion" width="1218" height="348">
  </a>
  <nav class="links" aria-label="Sections">
    <a href="#work">Work</a>
    <a href="#services">Services</a>
    <a href="#process">Process</a>
    <a href="#studio">Studio</a>
  </nav>
  <a class="btn btn-ember btn-small" href="#contact">Start a project</a>
</header>

<main>

  <!-- HERO -->
  <section class="hero" aria-labelledby="hero-headline">
    <div class="hero-stone" aria-hidden="true"></div>
    <div class="hero-film" id="hero-film" aria-hidden="true"></div>
    <svg class="seam seam-narrow" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <line x1="0" y1="100" x2="100" y2="80" pathLength="1" vector-effect="non-scaling-stroke"/>
    </svg>
    <svg class="seam seam-wide" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <line x1="60" y1="0" x2="43" y2="100" pathLength="1" vector-effect="non-scaling-stroke"/>
    </svg>
    <div class="hero-copy">
      <h1 id="hero-headline"></h1>
      <p class="hero-line" id="hero-line"></p>
      <div class="hero-actions">
        <a class="btn btn-ember" href="#work">Watch the work</a>
        <a class="btn btn-line" href="#contact">Start a project</a>
      </div>
    </div>
  </section>

  <!-- WORK -->
  <section class="band" id="work" aria-labelledby="work-heading">
    <div class="wrap">
      <h2 id="work-heading"></h2>
      <div class="films" id="films"></div>
    </div>
  </section>

  <!-- SERVICES -->
  <section class="band band-tight" id="services" aria-labelledby="services-heading">
    <div class="wrap">
      <h2 id="services-heading"></h2>
      <div class="services" id="services-list"></div>
      <p class="also" id="services-also"></p>
    </div>
  </section>

  <!-- PROCESS -->
  <section class="band band-tight" id="process" aria-labelledby="process-heading">
    <div class="wrap">
      <h2 id="process-heading"></h2>
      <ol class="steps" id="steps"></ol>
    </div>
  </section>

  <!-- STUDIO (light band) -->
  <section class="band band-light" id="studio" aria-labelledby="studio-heading">
    <div class="wrap studio">
      <h2 id="studio-heading"></h2>
      <div class="studio-body">
        <p class="studio-lead" id="studio-lead"></p>
        <p id="studio-text"></p>
        <p class="studio-closing" id="studio-closing"></p>
      </div>
    </div>
  </section>

  <!-- CONTACT -->
  <section class="band" id="contact" aria-labelledby="contact-heading">
    <div class="wrap contact">
      <div class="contact-intro">
        <h2 id="contact-heading"></h2>
        <p class="contact-line" id="contact-line"></p>
        <div class="contact-actions" id="contact-actions"></div>
      </div>
      <form class="form" id="form" novalidate>
        <label>Name
          <input type="text" name="name" autocomplete="name" required>
        </label>
        <label>Company
          <input type="text" name="company" autocomplete="organization">
        </label>
        <label>Phone
          <input type="tel" name="phone" autocomplete="tel" inputmode="tel">
        </label>
        <label>What do you need?
          <select name="need" id="need"></select>
        </label>
        <label class="wide">Message
          <textarea name="message" rows="4"></textarea>
        </label>
        <div class="wide form-foot">
          <button class="btn btn-ember" type="submit" id="send">Send</button>
          <p class="form-note" id="form-note" role="status"></p>
        </div>
      </form>
    </div>
  </section>

</main>

<footer class="foot">
  <div class="wrap foot-in">
    <div class="foot-brand">
      <img class="foot-logo" src="assets/greyrock-logo.svg" alt="Greyrock Motion" width="1218" height="348" loading="lazy">
    </div>
    <ul class="foot-list" id="foot-list"></ul>
    <p class="foot-legal" id="foot-legal"></p>
  </div>
</footer>

<div class="draft" id="draft" hidden></div>

<noscript>
  <p style="padding:2rem;color:#ECE8E1;background:#121315">Greyrock Motion makes launch films, 3D walkthroughs and ad films for builders, hotels and brands in Ujjain and Indore. Please turn on JavaScript to see the page.</p>
</noscript>

<script src="content.js"></script>
<script src="site.js"></script>
</body>
</html>
